name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The coverage number is reported, never gated. A reviewer wants to know which code
      # arrived without a test; a floor that must not fall would instead reward tests written
      # to move the number (handbook ch. 12.8). So this prints and does not fail.
      - name: Report coverage
        if: always()
        run: |
          set -euo pipefail
          [ -f coverage/coverage-summary.json ] || { echo "no coverage summary - did npm test run?"; exit 0; }
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log("### Coverage\n");
            console.log("| metric | % | covered |");
            console.log("|---|---|---|");
            for (const k of ["statements", "branches", "functions", "lines"]) console.log(row(k));
            console.log("\nReported, not gated - see SPEC-028.");
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

  # Every green merge to main releases: semantic-release reads the conventional commits since
  # the last tag, publishes that version, tags it and writes the GitHub Release. Commits that
  # change nothing a user sees (chore/docs/refactor/test/ci) release nothing. Nothing is
  # committed back: the version lives in the tag and the registry, and package.json says
  # 0.0.0-development.
  release:
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Two merges in quick succession must not compute the same next version at once.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # tag, GitHub release
      issues: write # release comments
      pull-requests: write # release comments
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every tag and the history since the last one
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x # npm 11, which OIDC trusted publishing needs
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Every non-draft PR from this repo publishes what it would ship, so a reviewer can install
  # it: <last tag>-pr.<N>.<sha> under dist-tag pr-<N>. Fork PRs get no OIDC token or
  # packages: write, so they are skipped. Published versions are permanent; the dist-tag moves.
  preview:
    needs: [build]
    if: >-
      github.event_name == 'pull_request'
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for the last tag
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - id: version
        name: Preview version
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
          version="${last#v}-pr.${PR}.${SHA:0:7}"
          # A re-run of the same commit must not fail on a version that already exists.
          if npm view "$(node -p 'require("./package.json").name')@${version}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "${version} is already published"; exit 0
          fi
          npm version "$version" --no-git-tag-version
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.skip == 'false'
        run: npm publish --tag "pr-${{ github.event.pull_request.number }}"
      - if: steps.version.outputs.skip == 'false'
        run: echo "Install with \`npm i $(node -p 'require("./package.json").name')@pr-${{ github.event.pull_request.number }}\` (${{ steps.version.outputs.version }})" >> "$GITHUB_STEP_SUMMARY"
